<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airgrid</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#090b0d;--surface:#101418;--elevated:#151b21;--line:#1d242c;--text:#e8edf2;--muted:#8b97a4;--subtle:#5d6b78;--accent:#7a9e8a;--wifi:#5b8cff;--bt:#2fd3c0;--cell:#f0b429;--open:#d4786a}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-rows:auto auto auto 1fr}
    header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
    .brand{display:flex;gap:10px;align-items:center}
    .mark{width:32px;height:32px;display:grid;place-items:center;background:var(--elevated);border-radius:4px;color:var(--accent);font-weight:600}
    h1{margin:0;font-size:14px} .sub{font-size:11px;color:var(--muted)}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .btn{background:var(--elevated);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px}
    .btn.primary{background:var(--text);color:var(--bg);font-weight:600;border-color:transparent}
    .btn.on{outline:1px solid var(--accent)}
    .btn.off{opacity:.4}
    .banner{padding:8px 14px;border-bottom:1px solid var(--line);background:#0c1014;font-size:12px;color:var(--muted)}
    form.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:10px 14px;border-bottom:1px solid var(--line)}
    .field{display:grid;gap:4px} .field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle)}
    .field input,.field select{background:#0b0e11;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;font-family:"IBM Plex Mono",monospace;min-width:7.5rem}
    .stage{display:grid;grid-template-columns:minmax(18rem,24rem) 1fr;min-height:0}
    aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--line);gap:1px}
    .stat{background:var(--surface);padding:8px 10px} .stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:14px} .stat span{font-size:10px;text-transform:uppercase;color:var(--subtle)}
    .tools{padding:8px;border-bottom:1px solid var(--line)}
    .tools input{width:100%;background:#0b0e11;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px}
    .list{overflow:auto;flex:1}
    .item{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit;padding:10px 12px;display:grid;gap:3px}
    .item:hover,.item.sel{background:var(--elevated)}
    .ssid{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
    .meta{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
    .tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
    .tag.wifi{color:var(--wifi)}.tag.bluetooth{color:var(--bt)}.tag.cell{color:var(--cell)}
    #map{min-height:0;background:#0a0d10}
    .legend{position:absolute;left:12px;top:12px;z-index:400;background:rgba(16,20,24,.92);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--muted)}
    .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
    .err{color:#ef6b6b;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px}
    .modal.open{display:flex}
    .card{width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
    .card h2{margin:0;font-size:16px}
    .dl{display:grid;grid-template-columns:7.5rem 1fr;gap:6px 12px}
    .dl dt{color:var(--subtle);font-size:11px;text-transform:uppercase}
    .dl dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12px;word-break:break-all}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    input[type=file]{display:none}
    @media(max-width:840px){.stage{grid-template-columns:1fr;grid-template-rows:48vh 1fr}aside{border-right:0;border-top:1px solid var(--line)}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark">A</div><div><h1>Airgrid</h1><div class="sub">Wi-Fi, Bluetooth, and cell map</div></div></div>
    <div class="row">
      <button class="btn on" data-layer="wifi" type="button">Wi-Fi</button>
      <button class="btn on" data-layer="bluetooth" type="button">BT</button>
      <button class="btn on" data-layer="cell" type="button">Cell</button>
      <button class="btn" id="keys" type="button">WiGLE key</button>
    </div>
  </header>
  <div class="banner" id="stats">Loading saved results…</div>
  <form class="toolbar" id="toolbar">
    <div class="field"><label>Latitude</label><input id="lat" value="25.784025" /></div>
    <div class="field"><label>Longitude</label><input id="lng" value="-80.136606" /></div>
    <div class="field"><label>Radius km</label><select id="radius"><option value="0.25">0.25</option><option value="0.5" selected>0.5</option><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option><option value="3">3</option></select></div>
    <div class="field"><label>City</label>
      <select id="preset">
        <option value="25.784025,-80.136606">Miami Beach</option>
        <option value="28.039465,-81.949804">Lakeland, FL</option>
        <option value="27.9506,-82.4572">Tampa, FL</option>
        <option value="25.7617,-80.1918">Miami</option>
        <option value="40.758,-73.9855">Times Square</option>
        <option value="37.784,-122.4075">San Francisco</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" id="geo" type="button">My location</button>
      <button class="btn primary" id="scan" type="submit">Scan</button>
      <button class="btn" id="live" type="button">Live refresh</button>
      <button class="btn" id="uploadBtn" type="button">Upload</button>
      <button class="btn" id="jsonBtn" type="button">JSON</button>
      <button class="btn" id="csvBtn" type="button">CSV</button>
    </div>
    <input id="file" type="file" accept=".json,.csv,.txt,.tsv,application/json,text/csv" />
  </form>
  <div class="stage">
    <aside>
      <div class="stats">
        <div class="stat"><b id="nAll">0</b><span>Mapped</span></div>
        <div class="stat"><b id="nWifi">0</b><span>Wi-Fi</span></div>
        <div class="stat"><b id="nBt">0</b><span>BT</span></div>
        <div class="stat"><b id="nCell">0</b><span>Cell</span></div>
      </div>
      <div class="tools"><input id="filter" placeholder="Filter name, MAC, type" /></div>
      <div class="err" id="err" hidden></div>
      <div class="list" id="list"></div>
    </aside>
    <section style="position:relative;min-height:0">
      <div class="legend">
        <div><i style="background:var(--wifi)"></i>Wi-Fi</div>
        <div><i style="background:var(--bt)"></i>Bluetooth</div>
        <div><i style="background:var(--cell)"></i>Cell</div>
      </div>
      <div id="map" style="height:100%"></div>
    </section>
  </div>
</div>
<div class="modal" id="keyModal"><div class="card">
  <h2>WiGLE API credentials</h2>
  <p class="sub">API Name (AID-…) and token from wigle.net/account — not the encoded blob. Keys stay in this browser. Each layer is 1 daily search.</p>
  <div class="field"><label>API name</label><input id="apiName" placeholder="AID-xxxxxxxx-xxxxx" /></div>
  <div class="field"><label>API token</label><input id="apiToken" type="password" placeholder="Stored locally" /></div>
  <div class="actions"><button class="btn" id="clearKeys" type="button">Remove</button><button class="btn primary" id="saveKeys" type="button">Save</button></div>
</div></div>
<div class="modal" id="detailModal"><div class="card" id="detailCard"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const CREDS="airgrid.creds.v2", CACHE="airgrid.cache.v4", USAGE="airgrid.usage.v1";
const layersOn={wifi:true,bluetooth:true,cell:true};
let networks=[], selected=null, markers=[], map, originMarker, scanCircle;
const el=id=>document.getElementById(id);
const ESCMAP={"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&#39;"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>ESCMAP[c]);
function loadJSON(k, fallback){try{return JSON.parse(localStorage.getItem(k)||"")||fallback}catch{return fallback}}
function saveJSON(k,v){localStorage.setItem(k, JSON.stringify(v))}
function pacificDay(){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function loadUsage(){const u=loadJSON(USAGE,{day:"",liveQueries:0}); if(u.day!==pacificDay()) return {day:pacificDay(), liveQueries:0}; return u}
function addUsage(n){const u=loadUsage(); u.liveQueries+=n; saveJSON(USAGE,u); return u}
function origin(){return {lat:Number(el("lat").value), lng:Number(el("lng").value)}}
function haversine(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,s=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)))}
function colorFor(n){if(n.kind==="bluetooth")return "#2fd3c0"; if(n.kind==="cell")return "#f0b429"; const e=(n.encryption||"").toUpperCase(); if(e.includes("WPA3"))return "#6b9b8c"; if(e.includes("WPA2"))return "#7a9e8a"; if(e.includes("WPA"))return "#8aa3b8"; if(e==="NONE"||e==="OPEN"||e.includes("WEP"))return "#d4786a"; return "#5b8cff"}
function displayName(n){const s=(n.name||n.ssid||"").trim(); return s||"[hidden]"}
function kindLabel(k){return k==="wifi"?"Wi-Fi":k==="bluetooth"?"Bluetooth":"Cell"}
function visible(){const q=el("filter").value.trim().toLowerCase(); const o=origin(); return networks.filter(n=>{if(!layersOn[n.kind])return false; n.distanceKm=haversine(o.lat,o.lng,n.lat,n.lng); if(!q)return true; return [n.name,n.ssid,n.id,n.type,n.encryption,n.kind,n.city,n.road].join(" ").toLowerCase().includes(q)}).sort((a,b)=>(a.distanceKm??9)-(b.distanceKm??9))}
function counts(list){return {all:list.length, wifi:list.filter(n=>n.kind==="wifi").length, bluetooth:list.filter(n=>n.kind==="bluetooth").length, cell:list.filter(n=>n.kind==="cell").length}}
function render(){const items=visible(); const c=counts(items); el("nAll").textContent=c.all; el("nWifi").textContent=c.wifi; el("nBt").textContent=c.bluetooth; el("nCell").textContent=c.cell;
  el("list").innerHTML=items.map(n=>`<button class="item ${selected===n.id?"sel":""}" data-id="${esc(n.id)}"><div class="ssid"><span>${esc(displayName(n))}</span><span class="tag ${n.kind}">${n.kind}</span></div><div class="meta">${esc(n.id)} ${esc(n.type||"")} ${n.distanceKm!=null?(n.distanceKm<1?Math.round(n.distanceKm*1000)+" m":n.distanceKm.toFixed(2)+" km"):""}</div></button>`).join("")||`<div class="item">No radios in view</div>`;
  markers.forEach(m=>m.remove()); markers=[]; items.forEach(n=>{const m=L.circleMarker([n.lat,n.lng],{radius:selected===n.id?9:6,color:selected===n.id?"#fff":colorFor(n),weight:selected===n.id?2:1,fillColor:colorFor(n),fillOpacity:.9}).addTo(map); m.bindPopup(`<b>${esc(displayName(n))}</b><br>${kindLabel(n.kind)} ${esc(n.type||"")}<br>${esc(n.id)}<br><i>Click for full details</i>`); m.on("click",()=>showDetail(n)); markers.push(m)});
}
function pair(l,v){if(v==null||v==="")return ""; return `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`}
function showDetail(n){selected=n.id; render(); map.panTo([n.lat,n.lng]); const maps=`https://www.google.com/maps?q=${n.lat},${n.lng}`;
  el("detailCard").innerHTML=`<div class="tag ${n.kind}">${kindLabel(n.kind)}</div><h2>${esc(displayName(n))}</h2><dl class="dl">${pair("ID",n.id)}${pair("Type",n.type)}${pair("Encryption",n.encryption)}${pair("Channel",n.channel)}${pair("QoS",n.qos)}${pair("Attributes",n.attributes)}${pair("Latitude",Number(n.lat).toFixed(6))}${pair("Longitude",Number(n.lng).toFixed(6))}${pair("Distance",n.distanceKm!=null?(n.distanceKm<1?Math.round(n.distanceKm*1000)+" m":n.distanceKm.toFixed(2)+" km"):"")}${pair("First seen",n.firsttime)}${pair("Last seen",n.lasttime||n.lastupdt)}${pair("Road",n.road)}${pair("City",n.city)}${pair("Region",n.region)}${pair("Country",n.country)}${pair("Postal",n.postalcode)}</dl><div class="actions"><button class="btn" id="copyCoords">Copy coords</button><a class="btn" href="${maps}" target="_blank" rel="noreferrer">Open map</a><button class="btn" id="closeDetail">Close</button></div>`;
  el("detailModal").classList.add("open"); el("closeDetail").onclick=()=>el("detailModal").classList.remove("open");
  el("copyCoords").onclick=()=>navigator.clipboard.writeText(n.lat+", "+n.lng);
}
function setOrigin(lat,lng,doScan){el("lat").value=Number(lat).toFixed(6); el("lng").value=Number(lng).toFixed(6); const o=origin(); originMarker.setLatLng([o.lat,o.lng]); scanCircle.setLatLng([o.lat,o.lng]).setRadius(Number(el("radius").value)*1000); map.setView([o.lat,o.lng], Math.max(map.getZoom(),15)); if(doScan) scan(false)}
function cacheKey(lat,lng,r,kind){return `${Number(lat).toFixed(4)}:${Number(lng).toFixed(4)}:${Number(r).toFixed(2)}:${kind}`}
function saveLayer(lat,lng,r,kind,results,source){const store=loadJSON(CACHE,{}); store[cacheKey(lat,lng,r,kind)]={source,results,savedAt:Date.now()}; saveJSON(CACHE,store)}
function readLayer(lat,lng,r,kind){return loadJSON(CACHE,{})[cacheKey(lat,lng,r,kind)]||null}
function nearMiami(lat,lng){return haversine(lat,lng,25.784025,-80.136606)<1.2}
function collect(lat,lng,r,kinds){const merged=[]; let live=false, missing=[];
  for(const k of kinds){ const cached=readLayer(lat,lng,r,k); if(cached){ merged.push(...cached.results); if(cached.source==="live") live=true; continue;}
    if(k==="cell" && nearMiami(lat,lng)){ saveLayer(lat,lng,r,"cell",BUNDLED_CELLS,"live"); merged.push(...BUNDLED_CELLS); live=true; continue;}
    missing.push(k);
  } return {merged, live, missing}}
function setErr(msg){el("err").hidden=!msg; el("err").textContent=msg||""}
async function scan(forceLive){setErr(""); const o=origin(); const r=Number(el("radius").value); const kinds=Object.keys(layersOn).filter(k=>layersOn[k]);
  if(!kinds.length){setErr("Turn on Wi-Fi, Bluetooth, or Cell."); return}
  const creds=loadJSON(CREDS,{}); const have=Boolean(creds.apiName&&creds.apiToken);
  const cached=collect(o.lat,o.lng,r,kinds);
  if(!forceLive && cached.missing.length===0 && cached.merged.length){ networks=cached.merged; paint("cached"); return}
  if(!forceLive && cached.live && cached.merged.length && !have){ networks=cached.merged; paint("cached"); return}
  if(!have){ if(cached.merged.length){ networks=cached.merged; paint("cached"); return} setErr("Add a WiGLE key for live data, or upload a JSON file."); return}
  const queryLayers=forceLive?kinds:cached.missing;
  if(!queryLayers.length){ networks=cached.merged; paint("cached"); return}
  if(forceLive && queryLayers.length>1 && !confirm(`Live refresh uses ${queryLayers.length} of your daily WiGLE searches (${queryLayers.join(", ")}). Continue?`)) return;
  el("stats").textContent="Scanning WiGLE…";
  try{
    const res=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lat:o.lat,lng:o.lng,radiusKm:r,layers:queryLayers,apiName:creds.apiName,apiToken:creds.apiToken,demo:false})});
    const data=await res.json(); if(!res.ok) throw new Error(data.error||"Scan failed");
    const by={wifi:[],bluetooth:[],cell:[]}; (data.results||[]).forEach(n=> (by[n.kind]||by.wifi).push(n));
    queryLayers.forEach(k=>saveLayer(o.lat,o.lng,r,k,by[k]||[],"live"));
    addUsage(queryLayers.length);
    const next=collect(o.lat,o.lng,r,kinds); networks=next.merged.length?next.merged:(data.results||[]); paint("live");
  }catch(e){ setErr(e.message); el("stats").textContent="Scan failed"}
}
function paint(source){const u=loadUsage(); const c=counts(networks); el("stats").textContent=`${source==="live"?"Live WiGLE":"Saved WiGLE results"}: ${c.cell} cell, ${c.wifi} Wi-Fi, ${c.bluetooth} Bluetooth. Upload JSON to add more without quota. Used today: ${u.liveQueries}/3.`; selected=null; render()}
function inferKind(row, filename=""){const k=String(row.kind||"").toLowerCase(); if(["wifi","bluetooth","cell"].includes(k)) return k;
  const t=String(row.type||row.Type||row.gentype||"").toLowerCase(); const a=String(row.attributes||""); const id=String(row.netid||row.id||row.MAC||""); const f=filename.toLowerCase();
  if(f.includes("cell")||/lte|gsm|nr|cdma/.test(t+a)||/^\d{3}\d{2,3}_\d+_\d+/.test(id)) return "cell";
  if(f.includes("blue")||f.includes("ble")||t==="bt"||t==="ble"||t.includes("bluetooth")) return "bluetooth";
  return "wifi"}
function mapRow(row, kind){const lat=Number(row.trilat??row.lat??row.latitude??row.CurrentLatitude); const lng=Number(row.trilong??row.lng??row.longitude??row.CurrentLongitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null; const id=String(row.netid||row.id||row.bssid||row.MAC||`${kind}-${lat}-${lng}`);
  return {kind,id,name:String(row.ssid||row.name||row.operator||"").trim()|| (kind==="cell"?"Cell site":kind==="bluetooth"?"BT device":""), lat,lng,
    encryption:String(row.encryption||row.AuthMode||""), channel:row.channel??row.Channel??null, type:String(row.type||row.gentype||(row.attributes||"").split(";")[0]||kind),
    lastupdt:row.lastupdt||null, lasttime:row.lasttime||null, firsttime:row.firsttime||null, qos:row.qos??null, city:row.city||null, road:row.road||null,
    housenumber:row.housenumber||null, postalcode:row.postalcode||null, country:row.country||null, region:row.region||null, attributes:row.attributes||null}}
function parseCSV(text){const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith("WigleWifi")&&!l.startsWith("#")); if(lines.length<2) throw new Error("CSV needs a header and rows");
  const delim=lines[0].includes("\t")?"\t":","; const split=line=>{const o=[]; let c="",q=false; for(let i=0;i<line.length;i++){const ch=line[i]; if(ch=='"'){if(q&&line[i+1]=='"'){c+='"';i++}else q=!q} else if(ch===delim&&!q){o.push(c);c=""} else c+=ch} o.push(c); return o};
  const headers=split(lines[0]).map(h=>h.trim()); const rows=[]; for(const line of lines.slice(1)){const cells=split(line); const row={}; headers.forEach((h,i)=>row[h]=cells[i]||""); rows.push(row)} return rows}
function importText(text, filename){const t=text.replace(/^\uFEFF/,"").trim(); if(!t) throw new Error("Empty file");
  let rows; if(t.startsWith("{")||t.startsWith("[")){ const p=JSON.parse(t); rows=Array.isArray(p)?p:Array.isArray(p.results)?p.results:Array.isArray(p.networks)?p.networks:[]; }
  else rows=parseCSV(t);
  const out=[]; for(const row of rows){ if(!row||typeof row!=="object") continue; const m=mapRow(row, inferKind(row, filename)); if(m) out.push(m)} if(!out.length) throw new Error("No mappable radios (need lat, lng, and an ID)."); return out}
function applyImport(list){const o=origin(); const r=Number(el("radius").value);
  const lats=list.map(n=>n.lat), lngs=list.map(n=>n.lng); const midLat=(Math.min(...lats)+Math.max(...lats))/2, midLng=(Math.min(...lngs)+Math.max(...lngs))/2;
  setOrigin(midLat, midLng, false);
  const by={wifi:[],bluetooth:[],cell:[]}; list.forEach(n=>by[n.kind].push(n));
  Object.keys(by).forEach(k=>{ if(!by[k].length) return; layersOn[k]=true; document.querySelector(`[data-layer="${k}"]`).classList.add("on"); document.querySelector(`[data-layer="${k}"]`).classList.remove("off");
    const prev=readLayer(midLat,midLng,r,k); const merged=[...(prev?.results||[])]; const seen=new Set(merged.map(x=>x.id)); by[k].forEach(n=>{if(!seen.has(n.id)) merged.push(n)}); saveLayer(midLat,midLng,r,k,merged,"live")});
  const next=collect(midLat,midLng,r,Object.keys(layersOn).filter(k=>layersOn[k])); networks=next.merged.length?next.merged:list; paint("cached")}
function download(name, body, mime){const blob=new Blob([body],{type:mime}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href)}
function toCSV(list){const h=["kind","name","id","lat","lng","encryption","channel","type","qos","firsttime","lasttime","lastupdt","road","city","region","country"]; const cell=v=>/["',\n]/.test(String(v??""))?`"${String(v).replaceAll('"','""')}"`:String(v??""); return [h.join(","),...list.map(n=>h.map(k=>cell(n[k])).join(","))].join("\n")}

map=L.map("map").setView([25.784025,-80.136606],16);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"OSM CARTO · WiGLE"}).addTo(map);
originMarker=L.circleMarker([25.784025,-80.136606],{radius:6,color:"#fff",weight:2,fillColor:"#7a9e8a",fillOpacity:1}).addTo(map);
scanCircle=L.circle([25.784025,-80.136606],{radius:500,color:"#7a9e8a",weight:1,fillOpacity:.05}).addTo(map);
map.on("click",e=>setOrigin(e.latlng.lat,e.latlng.lng,false));
document.querySelectorAll("[data-layer]").forEach(btn=>btn.addEventListener("click",()=>{const k=btn.dataset.layer; layersOn[k]=!layersOn[k]; btn.classList.toggle("on",layersOn[k]); btn.classList.toggle("off",!layersOn[k]); render()}));
el("filter").addEventListener("input",render);
el("list").addEventListener("click",e=>{const row=e.target.closest("[data-id]"); if(!row)return; const n=networks.find(x=>x.id===row.dataset.id); if(n) showDetail(n)});
el("preset").addEventListener("change",()=>{const p=el("preset").value.split(",").map(Number); setOrigin(p[0],p[1],true)});
el("radius").addEventListener("change",()=>scanCircle.setRadius(Number(el("radius").value)*1000));
el("geo").addEventListener("click",()=>navigator.geolocation.getCurrentPosition(pos=>setOrigin(pos.coords.latitude,pos.coords.longitude,true),()=>setErr("Location denied")));
el("toolbar").addEventListener("submit",e=>{e.preventDefault(); scan(false)});
el("live").addEventListener("click",()=>scan(true));
el("keys").addEventListener("click",()=>{const c=loadJSON(CREDS,{}); el("apiName").value=c.apiName||""; el("apiToken").value=c.apiToken||""; el("keyModal").classList.add("open")});
el("keyModal").addEventListener("click",e=>{if(e.target.id==="keyModal") el("keyModal").classList.remove("open")});
el("detailModal").addEventListener("click",e=>{if(e.target.id==="detailModal") el("detailModal").classList.remove("open")});
el("saveKeys").addEventListener("click",()=>{saveJSON(CREDS,{apiName:el("apiName").value.trim(), apiToken:el("apiToken").value.trim()}); el("keyModal").classList.remove("open")});
el("clearKeys").addEventListener("click",()=>{localStorage.removeItem(CREDS); el("keyModal").classList.remove("open")});
el("uploadBtn").addEventListener("click",()=>el("file").click());
el("file").addEventListener("change",async ev=>{const f=ev.target.files?.[0]; ev.target.value=""; if(!f)return; try{applyImport(importText(await f.text(), f.name))}catch(err){setErr(err.message)}});
el("jsonBtn").addEventListener("click",()=>download("airgrid.json", JSON.stringify({success:true,source:"airgrid",origin:origin(),results:visible()},null,2),"application/json"));
el("csvBtn").addEventListener("click",()=>download("airgrid.csv", toCSV(visible()), "text/csv"));
saveLayer(25.784025,-80.136606,0.5,"cell",BUNDLED_CELLS,"live");
networks=BUNDLED_CELLS.slice(); paint("cached"); render();
</script>
